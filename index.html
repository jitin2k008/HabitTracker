<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Habit Tracker</title>
  <script>
    "use strict";
    try {
      const savedTheme = localStorage.getItem("habitTracker.theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {
      // Blocked storage: follow the system theme.
    }
  </script>
  <style>
    :root {
      --bg: #f4f7f8;
      --surface: #ffffff;
      --surface-2: #e8f0f1;
      --text: #16222a;
      --muted: #566872;
      --border: #d6e0e3;
      --accent: #0f766e;
      --accent-contrast: #ffffff;
      --danger: #d93f3f;
      --shadow: 0 1px 3px rgba(16, 24, 40, .08);
    }

    :root[data-theme="dark"] {
      --bg: #0d1517;
      --surface: #152023;
      --surface-2: #1e2d31;
      --text: #e6f0f1;
      --muted: #93a9ae;
      --border: #2a3c41;
      --accent: #2dd4bf;
      --accent-contrast: #08201d;
      --danger: #f87171;
      --shadow: 0 1px 3px rgba(0, 0, 0, .5);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1517;
        --surface: #152023;
        --surface-2: #1e2d31;
        --text: #e6f0f1;
        --muted: #93a9ae;
        --border: #2a3c41;
        --accent: #2dd4bf;
        --accent-contrast: #08201d;
        --danger: #f87171;
        --shadow: 0 1px 3px rgba(0, 0, 0, .5);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn {
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      transition: opacity .15s;
    }

    .icon-btn:hover {
      opacity: .9;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .primary-btn,
    .secondary-btn {
      min-height: 40px;
      padding: 0 16px;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }

    .primary-btn {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .primary-btn:hover,
    .secondary-btn:hover {
      opacity: .9;
    }

    .primary-btn:disabled,
    .secondary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #storage-banner {
      margin: 0 0 16px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 14px;
    }

    #storage-banner[hidden] {
      display: none;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .stat-label {
      font-size: 13px;
      color: var(--muted);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
    }

    .stat-sub {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
    }

    #progress {
      height: 8px;
      margin-top: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      overflow: hidden;
    }

    #progress[hidden] {
      display: none;
    }

    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: 12px;
      background: var(--accent);
      transition: width .15s;
    }

    #history-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    #history-bar[hidden] {
      display: none;
    }

    #history-range {
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }

    #habit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    #habit-grid.is-empty {
      display: block;
    }

    .empty-state {
      margin: 32px 0;
      text-align: center;
      color: var(--muted);
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-name {
      min-width: 0;
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      flex: none;
      padding: 4px 8px;
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 13px;
      font-weight: 600;
    }

    .card-days {
      margin: 0;
      font-size: 14px;
      color: var(--muted);
    }

    .card-mini {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mini {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 4px;
      border-radius: 12px;
      background: var(--surface-2);
    }

    .mini-label {
      font-size: 11px;
      color: var(--muted);
    }

    .mini-value {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .history {
      display: flex;
      gap: 4px;
    }

    .hist-day {
      display: flex;
      flex: 1;
      max-width: 24px;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .hist-cell {
      width: 100%;
      max-width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: none;
      cursor: pointer;
    }

    .hist-cell:disabled {
      cursor: default;
    }

    .hist-cell.is-done {
      border-color: var(--accent);
      background: var(--accent);
    }

    .hist-cell.is-today {
      border: 2px solid var(--accent);
    }

    .hist-cell.is-off {
      border-style: dashed;
      opacity: .4;
    }

    .hist-cell.is-before {
      opacity: .5;
    }

    .hist-letter {
      font-size: 10px;
      line-height: 1.2;
      color: var(--muted);
    }

    .today-btn {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }

    .today-btn:hover:enabled {
      opacity: .9;
    }

    .today-btn.is-done {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .today-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .card-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .link-btn {
      min-height: 40px;
      padding: 0 8px;
      border: none;
      border-radius: 12px;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .link-btn.danger {
      color: var(--danger);
    }

    .link-btn:hover {
      opacity: .8;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    dialog {
      width: min(420px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      padding: 0;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    dialog::backdrop {
      background: var(--text);
      opacity: .4;
    }

    :root[data-theme="dark"] dialog::backdrop {
      background: var(--bg);
      opacity: .6;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) dialog::backdrop {
        background: var(--bg);
        opacity: .6;
      }
    }

    .dialog-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }

    #dialog-title {
      margin: 0;
      font-size: 20px;
    }

    .field-label {
      font-size: 14px;
      font-weight: 600;
    }

    #habit-name {
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
    }

    fieldset {
      margin: 0;
      padding: 0;
      border: none;
    }

    legend {
      margin-bottom: 8px;
      padding: 0;
      font-size: 14px;
      font-weight: 600;
    }

    .day-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      position: relative;
    }

    .chip input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .chip-face {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 40px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      transition: background-color .15s, color .15s;
    }

    .chip input:checked + .chip-face {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-contrast);
    }

    .chip input:focus-visible + .chip-face {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #form-error {
      margin: 0;
      font-size: 14px;
      color: var(--danger);
    }

    #form-error:empty {
      display: none;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Habit Tracker</h1>
      <div class="header-actions">
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle dark mode">🌙</button>
        <button id="add-btn" class="primary-btn" type="button">+ New habit</button>
      </div>
    </header>

    <p id="storage-banner" hidden>Storage unavailable: changes won't be saved.</p>

    <main>
      <section id="stats" class="stats"></section>

      <div id="progress" hidden>
        <div id="progress-fill"></div>
      </div>

      <div id="history-bar" hidden>
        <button id="history-prev" class="secondary-btn" type="button">‹ Earlier</button>
        <span id="history-range"></span>
        <button id="history-next" class="secondary-btn" type="button">Later ›</button>
      </div>

      <section id="habit-grid" class="habit-grid"></section>
    </main>

    <dialog id="habit-dialog">
      <form id="habit-form" class="dialog-form">
        <h2 id="dialog-title">New habit</h2>

        <label class="field-label" for="habit-name">Habit name</label>
        <input id="habit-name" type="text" maxlength="40" autofocus autocomplete="off">

        <fieldset>
          <legend>Active days</legend>
          <div id="day-chips" class="day-chips"></div>
        </fieldset>

        <p id="form-error" role="alert"></p>

        <div class="dialog-actions">
          <button id="cancel-btn" class="secondary-btn" type="button">Cancel</button>
          <button id="submit-btn" class="primary-btn" type="submit">Add habit</button>
        </div>
      </form>
    </dialog>
  </div>

  <script>
    "use strict";

    const STORAGE_KEY = "habitTracker.v1";
    const CORRUPT_KEY = "habitTracker.v1.corrupt";
    const THEME_KEY = "habitTracker.theme";
    const DATE_KEY_RE = /^\d{4}-\d{2}-\d{2}$/;
    const DAY_SHORT = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const DAY_INITIAL = ["S", "M", "T", "W", "T", "F", "S"];
    const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];
    const MAX_HISTORY_PAGE = 26;
    const CHIP_DAYS = WEEK_ORDER.map((day) => ({ value: day, label: DAY_SHORT[day] }));
    const HTML_ESCAPES = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

    const statsEl = document.getElementById("stats");
    const progressEl = document.getElementById("progress");
    const progressFillEl = document.getElementById("progress-fill");
    const historyBarEl = document.getElementById("history-bar");
    const historyPrevEl = document.getElementById("history-prev");
    const historyRangeEl = document.getElementById("history-range");
    const historyNextEl = document.getElementById("history-next");
    const habitGridEl = document.getElementById("habit-grid");
    const storageBannerEl = document.getElementById("storage-banner");
    const themeBtnEl = document.getElementById("theme-btn");
    const addBtnEl = document.getElementById("add-btn");
    const habitDialogEl = document.getElementById("habit-dialog");
    const habitFormEl = document.getElementById("habit-form");
    const dialogTitleEl = document.getElementById("dialog-title");
    const habitNameEl = document.getElementById("habit-name");
    const dayChipsEl = document.getElementById("day-chips");
    const formErrorEl = document.getElementById("form-error");
    const cancelBtnEl = document.getElementById("cancel-btn");
    const submitBtnEl = document.getElementById("submit-btn");

    let state = { habits: [] };
    let editingId = null;
    let historyPage = 0;
    let lastToday = "";

    function pad2(value) {
      return value < 10 ? "0" + value : String(value);
    }

    function toKey(date) {
      return date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate());
    }

    function fromKey(key) {
      const parts = key.split("-");
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]), 12);
    }

    function addDays(key, days) {
      const date = fromKey(key);
      date.setDate(date.getDate() + days);
      return toKey(date);
    }

    function weekdayOf(key) {
      return fromKey(key).getDay();
    }

    function todayKey() {
      return toKey(new Date());
    }

    function isAscendingUnique(list) {
      for (let i = 1; i < list.length; i += 1) {
        if (!(list[i] > list[i - 1])) return false;
      }
      return true;
    }

    function isHabitShape(habit) {
      return habit !== null && typeof habit === "object" &&
        typeof habit.id === "string" && habit.id.length > 0 &&
        typeof habit.name === "string" &&
        habit.name.length >= 1 && habit.name.length <= 40 &&
        habit.name === habit.name.trim() &&
        Array.isArray(habit.activeDays) &&
        habit.activeDays.length >= 1 &&
        habit.activeDays.every((day) => Number.isInteger(day) && day >= 0 && day <= 6) &&
        isAscendingUnique(habit.activeDays) &&
        typeof habit.createdAt === "string" && DATE_KEY_RE.test(habit.createdAt) &&
        Array.isArray(habit.completions) &&
        habit.completions.every((key) => typeof key === "string" && DATE_KEY_RE.test(key)) &&
        isAscendingUnique(habit.completions);
    }

    function isStateShape(data) {
      return data !== null && typeof data === "object" &&
        Array.isArray(data.habits) &&
        data.habits.every(isHabitShape);
    }

    function markStorageUnavailable() {
      storageBannerEl.hidden = false;
    }

    function loadState() {
      let raw = null;
      try {
        raw = localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        markStorageUnavailable();
        return { habits: [] };
      }
      if (raw === null) return { habits: [] };
      try {
        const data = JSON.parse(raw);
        if (isStateShape(data)) return { habits: data.habits };
      } catch (error) {
        // Invalid JSON is handled like a wrong shape: back up and start empty.
      }
      try {
        localStorage.setItem(CORRUPT_KEY, raw);
      } catch (error) {
        markStorageUnavailable();
      }
      return { habits: [] };
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        markStorageUnavailable();
      }
    }

    function effectiveTheme() {
      const stored = document.documentElement.dataset.theme;
      if (stored === "light" || stored === "dark") return stored;
      return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }

    function updateThemeButton() {
      themeBtnEl.textContent = effectiveTheme() === "dark" ? "☀️" : "🌙";
    }

    function toggleTheme() {
      const next = effectiveTheme() === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      try {
        localStorage.setItem(THEME_KEY, next);
      } catch (error) {
        // The theme still applies for this session.
      }
      updateThemeButton();
    }

    function isScheduled(habit, key) {
      return habit.activeDays.indexOf(weekdayOf(key)) !== -1;
    }

    function habitStart(habit) {
      return habit.completions.length > 0 && habit.completions[0] < habit.createdAt
        ? habit.completions[0]
        : habit.createdAt;
    }

    function calcCurrentStreak(habit, today) {
      const start = habitStart(habit);
      let streak = 0;
      let day = today;
      while (day >= start) {
        if (habit.completions.indexOf(day) !== -1) {
          streak += 1;
        } else if (isScheduled(habit, day) && day !== today) {
          break;
        }
        day = addDays(day, -1);
      }
      return streak;
    }

    function calcBestStreak(habit, today) {
      const start = habitStart(habit);
      let run = 0;
      let best = 0;
      let day = start;
      while (day <= today) {
        if (habit.completions.indexOf(day) !== -1) {
          run += 1;
          if (run > best) best = run;
        } else if (isScheduled(habit, day) && day !== today) {
          run = 0;
        }
        day = addDays(day, 1);
      }
      return best;
    }

    function addHabit(name, activeDays) {
      state.habits.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        name: name,
        activeDays: activeDays.slice().sort((a, b) => a - b),
        createdAt: todayKey(),
        completions: []
      });
      saveState();
      render();
    }

    function deleteHabit(habitId) {
      const habit = state.habits.find((item) => item.id === habitId);
      if (!habit) return;
      if (!confirm('Delete "' + habit.name + '"? This removes all its history.')) return;
      state.habits = state.habits.filter((item) => item.id !== habitId);
      saveState();
      render();
    }

    function updateHabit(habitId, name, activeDays) {
      const habit = state.habits.find((item) => item.id === habitId);
      if (!habit) return;
      habit.name = name;
      habit.activeDays = activeDays.slice().sort((a, b) => a - b);
      saveState();
      render();
    }

    function showEarlierDays() {
      if (historyPage >= MAX_HISTORY_PAGE) return;
      historyPage += 1;
      render();
    }

    function showLaterDays() {
      if (historyPage <= 0) return;
      historyPage -= 1;
      render();
    }

    function toggleCompletion(habitId, key) {
      const habit = state.habits.find((item) => item.id === habitId);
      if (!habit) return;
      if (key > todayKey()) return;
      const isDone = habit.completions.indexOf(key) !== -1;
      if (!isDone && !isScheduled(habit, key)) return;
      if (isDone) {
        habit.completions = habit.completions.filter((item) => item !== key);
      } else {
        habit.completions = habit.completions.concat(key).sort();
      }
      saveState();
      render();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => HTML_ESCAPES[character]);
    }

    function daysLabel(habit) {
      if (habit.activeDays.length === 7) return "Every day";
      return WEEK_ORDER
        .filter((day) => habit.activeDays.indexOf(day) !== -1)
        .map((day) => DAY_SHORT[day])
        .join(" ");
    }

    function countToday(today) {
      const scheduled = state.habits.filter((habit) => isScheduled(habit, today));
      const done = scheduled.filter((habit) => habit.completions.indexOf(today) !== -1).length;
      return { total: scheduled.length, done: done };
    }

    function statCard(label, valueHtml) {
      return '<div class="stat"><div class="stat-label">' + label + "</div>" +
        '<div class="stat-value">' + valueHtml + "</div></div>";
    }

    function renderStats() {
      const today = todayKey();
      const todayCount = countToday(today);
      const todayValue = todayCount.total === 0 ? "-" : todayCount.done + "/" + todayCount.total;
      let bestCurrent = 0;
      let bestOverall = 0;
      let totalCompletions = 0;
      state.habits.forEach((habit) => {
        const current = calcCurrentStreak(habit, today);
        const best = calcBestStreak(habit, today);
        if (current > bestCurrent) bestCurrent = current;
        if (best > bestOverall) bestOverall = best;
        totalCompletions += habit.completions.length;
      });
      statsEl.innerHTML =
        statCard("Today", todayValue) +
        statCard("Current streak", bestCurrent + ' <span class="stat-sub">days</span>') +
        statCard("Best streak", String(bestOverall)) +
        statCard("Completions", String(totalCompletions));
    }

    function renderProgress() {
      const todayCount = countToday(todayKey());
      const percent = todayCount.total === 0
        ? 0
        : Math.round((todayCount.done / todayCount.total) * 100);
      progressEl.hidden = state.habits.length === 0;
      progressFillEl.style.width = percent + "%";
    }

    function formatHistoryDate(key) {
      return fromKey(key).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    }

    function renderHistory() {
      const windowEnd = addDays(todayKey(), -14 * historyPage);
      historyBarEl.hidden = state.habits.length === 0;
      historyRangeEl.textContent = formatHistoryDate(addDays(windowEnd, -13)) +
        " – " + formatHistoryDate(windowEnd);
      historyPrevEl.disabled = historyPage >= MAX_HISTORY_PAGE;
      historyNextEl.disabled = historyPage <= 0;
    }

    function historyCellHtml(habit, day, today) {
      const done = habit.completions.indexOf(day) !== -1;
      const scheduled = isScheduled(habit, day);
      const clickable = scheduled || done;
      const classes = ["hist-cell"];
      if (done) {
        classes.push("is-done");
      } else if (!scheduled) {
        classes.push("is-off");
      } else if (day === today) {
        classes.push("is-today");
      } else if (day < habit.createdAt) {
        classes.push("is-before");
      }
      const dateLabel = fromKey(day).toLocaleDateString("en-GB", {
        weekday: "short",
        day: "numeric",
        month: "short"
      });
      const attributes = clickable
        ? ' data-action="toggle-day" data-id="' + escapeHtml(habit.id) +
          '" data-date="' + day + '"'
        : " disabled";
      return '<div class="hist-day">' +
        '<button type="button" class="' + classes.join(" ") + '"' +
        ' title="' + escapeHtml(dateLabel) + '"' +
        ' aria-label="' + escapeHtml(dateLabel) + '"' +
        ' aria-pressed="' + (done ? "true" : "false") + '"' +
        attributes + "></button>" +
        '<span class="hist-letter">' + DAY_INITIAL[weekdayOf(day)] + "</span>" +
        "</div>";
    }

    function historyHtml(habit, today) {
      const windowEnd = addDays(today, -14 * historyPage);
      let html = '<div class="history">';
      for (let offset = 13; offset >= 0; offset -= 1) {
        html += historyCellHtml(habit, addDays(windowEnd, -offset), today);
      }
      return html + "</div>";
    }

    function habitCardHtml(habit, today) {
      const streak = calcCurrentStreak(habit, today);
      const best = calcBestStreak(habit, today);
      const doneToday = habit.completions.indexOf(today) !== -1;
      const scheduledToday = isScheduled(habit, today);
      const idAttribute = escapeHtml(habit.id);
      let todayButton;
      if (doneToday) {
        todayButton = '<button type="button" class="today-btn is-done" data-action="toggle-today"' +
          ' data-id="' + idAttribute + '" aria-pressed="true">Done ✓</button>';
      } else if (scheduledToday) {
        todayButton = '<button type="button" class="today-btn" data-action="toggle-today"' +
          ' data-id="' + idAttribute + '" aria-pressed="false">Mark done</button>';
      } else {
        todayButton = '<button type="button" class="today-btn" data-action="toggle-today"' +
          ' data-id="' + idAttribute + '" aria-pressed="false" disabled>Rest day</button>';
      }
      const miniHtml =
        '<div class="card-mini">' +
        '<div class="mini"><span class="mini-label">Current</span>' +
        '<span class="mini-value">' + streak + "</span></div>" +
        '<div class="mini"><span class="mini-label">Best</span>' +
        '<span class="mini-value">' + best + "</span></div>" +
        '<div class="mini"><span class="mini-label">Total</span>' +
        '<span class="mini-value">' + habit.completions.length + "</span></div>" +
        "</div>";
      return '<article class="card">' +
        '<div class="card-head">' +
        '<h2 class="card-name">' + escapeHtml(habit.name) + "</h2>" +
        '<span class="badge">' + (streak >= 3 ? "🔥 " : "") + streak + " day streak</span>" +
        "</div>" +
        '<p class="card-days">' + escapeHtml(daysLabel(habit)) + "</p>" +
        miniHtml +
        todayButton +
        historyHtml(habit, today) +
        '<div class="card-foot">' +
        '<button type="button" class="link-btn" data-action="edit"' +
        ' data-id="' + idAttribute + '">Edit</button>' +
        '<button type="button" class="link-btn danger" data-action="delete"' +
        ' data-id="' + idAttribute + '">Delete</button>' +
        "</div>" +
        "</article>";
    }

    function renderHabits() {
      if (state.habits.length === 0) {
        habitGridEl.classList.add("is-empty");
        habitGridEl.innerHTML =
          "<p class=\"empty-state\">No habits yet. Click '+ New habit' to start.</p>";
        return;
      }
      habitGridEl.classList.remove("is-empty");
      const today = todayKey();
      habitGridEl.innerHTML = state.habits
        .map((habit) => habitCardHtml(habit, today))
        .join("");
    }

    function render() {
      renderStats();
      renderProgress();
      renderHistory();
      renderHabits();
    }

    function buildDayChips() {
      dayChipsEl.innerHTML = CHIP_DAYS.map((day) =>
        '<label class="chip">' +
        '<input type="checkbox" value="' + day.value + '" checked>' +
        '<span class="chip-face">' + day.label + "</span>" +
        "</label>"
      ).join("");
    }

    function setDayChips(activeDays) {
      dayChipsEl.querySelectorAll("input").forEach((input) => {
        input.checked = activeDays.indexOf(Number(input.value)) !== -1;
      });
    }

    function getCheckedDays() {
      return Array.from(dayChipsEl.querySelectorAll("input:checked"))
        .map((input) => Number(input.value));
    }

    function showFormError(message) {
      formErrorEl.textContent = message;
    }

    function openAddDialog() {
      editingId = null;
      showFormError("");
      habitNameEl.value = "";
      setDayChips(WEEK_ORDER);
      dialogTitleEl.textContent = "New habit";
      submitBtnEl.textContent = "Add habit";
      habitDialogEl.showModal();
      habitNameEl.focus();
    }

    function openEditDialog(habitId) {
      const habit = state.habits.find((item) => item.id === habitId);
      if (!habit) return;
      editingId = habit.id;
      showFormError("");
      habitNameEl.value = habit.name;
      setDayChips(habit.activeDays);
      dialogTitleEl.textContent = "Edit habit";
      submitBtnEl.textContent = "Save";
      habitDialogEl.showModal();
      habitNameEl.focus();
    }

    function hasDuplicateName(name, ignoreId) {
      const normalized = name.toLowerCase();
      return state.habits.some((habit) =>
        habit.id !== ignoreId && habit.name.toLowerCase() === normalized
      );
    }

    function validateHabit(name) {
      if (name.length === 0) return "Enter a habit name.";
      if (hasDuplicateName(name, editingId)) return "That name already exists.";
      if (getCheckedDays().length === 0) return "Pick at least one day.";
      return "";
    }

    function onFormSubmit(event) {
      event.preventDefault();
      const name = habitNameEl.value.trim();
      const message = validateHabit(name);
      if (message) {
        showFormError(message);
        return;
      }
      if (editingId === null) {
        addHabit(name, getCheckedDays());
      } else {
        updateHabit(editingId, name, getCheckedDays());
      }
      habitDialogEl.close();
    }

    function onGridClick(event) {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const habit = state.habits.find((item) => item.id === button.dataset.id);
      if (!habit) return;
      const action = button.dataset.action;
      if (action === "toggle-today") {
        toggleCompletion(habit.id, todayKey());
      } else if (action === "toggle-day") {
        toggleCompletion(habit.id, button.dataset.date);
      } else if (action === "edit") {
        openEditDialog(habit.id);
      } else if (action === "delete") {
        deleteHabit(habit.id);
      }
    }

    function onNameKeydown(event) {
      if (event.isComposing || event.key !== "Enter") return;
      event.preventDefault();
      habitFormEl.requestSubmit();
    }

    function checkDayRollover() {
      const today = todayKey();
      if (today === lastToday) return;
      lastToday = today;
      render();
    }

    function onVisibilityChange() {
      if (document.visibilityState === "visible") checkDayRollover();
    }

    function attachListeners() {
      addBtnEl.addEventListener("click", openAddDialog);
      themeBtnEl.addEventListener("click", toggleTheme);
      cancelBtnEl.addEventListener("click", () => habitDialogEl.close());
      habitFormEl.addEventListener("submit", onFormSubmit);
      habitNameEl.addEventListener("keydown", onNameKeydown);
      habitGridEl.addEventListener("click", onGridClick);
      historyPrevEl.addEventListener("click", showEarlierDays);
      historyNextEl.addEventListener("click", showLaterDays);
      document.addEventListener("visibilitychange", onVisibilityChange);
      window.setInterval(checkDayRollover, 30000);
    }

    function init() {
      state = loadState();
      lastToday = todayKey();
      updateThemeButton();
      buildDayChips();
      attachListeners();
      render();
    }

    init();
  </script>
</body>
</html>
